[package]
name = "rust-enterprise-boilerplate"
version = "0.1.0"
edition = "2021"
authors = ["Ilton Seixas <contact@iltonseixas.com>"]
license = "MIT"

[[bin]]
name = "boilerplate"
path = "src/main.rs"

[features]
default = []
postgres = ["sqlx/postgres", "sqlx/runtime-tokio-rustls"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
tower_governor = { version = "0.4", features = ["axum"] }

# gRPC
tonic = "0.11"
prost = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros", "migrate"], optional = true }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Security
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"

# Config
config = "0.14"
dotenvy = "0.15"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["trace"] }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.14", features = ["tonic", "trace"] }
opentelemetry-semantic-conventions = "0.13"
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# Error handling
thiserror = "1"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "3"

[dev-dependencies]
mockall = "0.12"
tokio = { version = "1", features = ["full", "test-util"] }
axum-test = "14"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
