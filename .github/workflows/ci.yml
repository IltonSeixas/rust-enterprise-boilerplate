name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings, default features)
        run: cargo clippy -- -D warnings

      - name: Clippy (deny warnings, postgres feature)
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --features postgres -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked

      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
        run: sqlx migrate run --source migrations

      - name: Unit tests (postgres feature)
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test
        run: cargo test --features postgres

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # RUSTSEC-2023-0071 (rsa Marvin Attack): unconditional dependency of
        # sqlx-macros-core via the MySQL driver, used only by its auth
        # handshake. This project uses the postgres feature exclusively and
        # never exercises this code path. No fixed version is available upstream.
        run: cargo audit --ignore RUSTSEC-2023-0071
